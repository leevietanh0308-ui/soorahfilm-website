name: Deploy SOORAH to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code củng/package-lock.json
      - run: npm ci
        working-directory: code củng
      - run: npm run build
        working-directory: code củng
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /soorahfilm-website
          NEXT_PUBLIC_SITE_URL: https://leevietanh0308-ui.github.io/soorahfilm-website
          NEXT_PUBLIC_ORDER_WEB_APP_URL: ${{ vars.NEXT_PUBLIC_ORDER_WEB_APP_URL }}
      - run: touch out/.nojekyll
        working-directory: code củng
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code củng/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
